<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Outer Focus Ring -->
  <circle cx="32" cy="32" r="22" stroke="url(#lensGrad)" stroke-width="2.5" stroke-dasharray="24 6 12 6" />
  
  <!-- Inner Iris Aperture -->
  <circle cx="32" cy="32" r="14" stroke="#38bdf8" stroke-width="2" fill="#0f172a" fill-opacity="0.8" />
  
  <!-- Center Core Lens Pulse -->
  <circle cx="32" cy="32" r="6" fill="url(#lensGrad)" filter="url(#glow)" />
  
  <!-- Crosshair Precision Ticks -->
  <line x1="32" y1="4" x2="32" y2="10" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="54" x2="32" y2="60" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="4" y1="32" x2="10" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="54" y1="32" x2="60" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Diagonal Reflection Accents -->
  <circle cx="27" cy="27" r="2" fill="#ffffff" fill-opacity="0.9" />
</svg>
