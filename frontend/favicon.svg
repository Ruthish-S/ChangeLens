<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lensGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="50%" stop-color="#2997FF"/>
      <stop offset="100%" stop-color="#0051B3"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5AC8FA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="appleShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0071E3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Smooth Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#lensGrad)"/>
  
  <!-- Subtle Internal Highlight / Glass Layer -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="4" y="4" width="56" height="28" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Precision Optical Aperture / Lens Rings -->
  <!-- Outer Calibration Circle -->
  <circle cx="32" cy="32" r="19" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2 3"/>
  
  <!-- Main High-Precision Optical Ring -->
  <circle cx="32" cy="32" r="14" stroke="#FFFFFF" stroke-width="2.5" fill="url(#innerGlow)"/>

  <!-- Aperture Focal Leaves / Geometric Precision Crosshair -->
  <path d="M32 11V19M32 45V53M11 32H19M45 32H53" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic Aperture Blade Highlights -->
  <path d="M26 23L38 23L32 35Z" fill="#FFFFFF" fill-opacity="0.2"/>
  <path d="M38 41L26 41L32 29Z" fill="#FFFFFF" fill-opacity="0.2"/>

  <!-- Core Precision Focal Point (Laser Alignment) -->
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="2" fill="#0071E3"/>
</svg>
